# Trägt beide Instanzen: die Produktion in /apps/lernassi und die Dev-Instanz in
# /apps/lernassi-dev. Was sie unterscheidet, steht in der jeweiligen .env daneben —
# ohne Angabe gelten die Werte der Produktion, damit ein Checkout ohne .env immer noch
# das tut, was er vorher tat.
#
#   Produktion  lernassi.hydrocode.cloud      127.0.0.1:8030  /data/lernassi
#   Dev         dev.lernassi.hydrocode.cloud  127.0.0.1:8032  /data/lernassi-dev
#
# Den Projektnamen (und damit die Containernamen) leitet Compose aus dem Verzeichnis ab,
# die beiden Instanzen kommen sich also nicht ins Gehege.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${LERNASSI_PORT:-8030}:3000'
    env_file:
      - path: .env
        required: false
    environment:
      # Datenbank und Bilder liegen auf dem Wirt, nicht im Container. Im Container immer
      # unter /data — welches Wirtsverzeichnis das ist, entscheidet LERNASSI_DATEN unten.
      DATABASE_URL: /data/db/lernassi.db
      UPLOAD_DIR: /data/uploads
      # Hinter dem Proxy muss SvelteKit wissen, wie es von außen heißt. Steht das falsch,
      # scheitert jede Formularabsendung an der Origin-Prüfung — auf Dev also zwingend
      # LERNASSI_ORIGIN in der .env setzen.
      ORIGIN: ${LERNASSI_ORIGIN:-https://lernassi.hydrocode.cloud}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      BETTER_AUTH_URL: ${LERNASSI_ORIGIN:-https://lernassi.hydrocode.cloud}
      # Welche der beiden Instanzen das hier ist — sie unterscheiden sich im Zeichen der
      # PWA, damit auf einem Tablet niemand die falsche antippt. Ohne Angabe liest die
      # Anwendung es an ORIGIN ab (`dev.…` heißt Dev), zu setzen ist hier also nichts.
      # Nur wenn das einmal nicht stimmt: `staging` oder `produktion` in die .env.
      LERNASSI_UMGEBUNG:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET fehlt in .env}
      # Einmalcode für Lehrkraft-Konten. Bewusst im Klartext: er sperrt das freie
      # Registrieren, schützt aber nichts, was schon angelegt ist. Zum Ändern hier
      # ersetzen (oder in der .env überschreiben) und neu hochfahren.
      TEACHER_SIGNUP_CODE: ${TEACHER_SIGNUP_CODE:-L3RNassiRocks}
      REQUESTY_BASE_URL: ${REQUESTY_BASE_URL:-https://router.eu.requesty.ai/v1}
      REQUESTY_MODEL: ${REQUESTY_MODEL:-anthropic/claude-sonnet-4-5}
      # Ohne Wert heißt: nur weitergeben, wenn im .env gesetzt. Eine leere
      # Vorgabe wäre schlimmer als keine — der Code prüft auf null, nicht auf
      # leer, und würde "" als Modellnamen an Requesty schicken.
      REQUESTY_API_KEY:
      REQUESTY_MODEL_PRUEF:
      REQUESTY_MODEL_SPIEGEL:
      REQUESTY_MODEL_PLAN:
      REQUESTY_MODEL_BEURTEILUNG:
      REQUESTY_MODEL_BEWERTER:
    volumes:
      - ${LERNASSI_DATEN:-/data/lernassi}:/data
