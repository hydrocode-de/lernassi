# Nur für das erste Aufsetzen: reines HTTP, damit Certbot die Challenge
# ausliefern kann, solange es noch kein Zertifikat gibt. Danach wird
# /etc/nginx/sites-enabled/lernassi.conf auf lernassi.conf umgelegt.
server {
    server_name lernassi.hydrocode.cloud;
    listen 80;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        client_max_body_size 25M;

        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
