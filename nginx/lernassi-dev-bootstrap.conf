# Nur für das erste Aufsetzen der Dev-Instanz: reines HTTP, damit Certbot die
# Challenge ausliefern kann, solange es noch kein Zertifikat gibt. Danach wird
# /etc/nginx/sites-enabled/lernassi-dev.conf auf lernassi-dev.conf umgelegt.
server {
    server_name dev.lernassi.hydrocode.cloud;
    listen 80;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        client_max_body_size 25M;

        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
