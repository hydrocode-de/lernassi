# lernassi — SvelteKit (adapter-node) im Container auf 127.0.0.1:8030
#
# Auf dem Server verlinkt:
#   /etc/nginx/sites-enabled/lernassi.conf -> /apps/lernassi/nginx/lernassi.conf
#
# Diese Datei setzt ein Zertifikat für lernassi.hydrocode.cloud voraus. Beim
# ersten Aufsetzen deshalb erst lernassi-bootstrap.conf verlinken, Zertifikat
# holen, dann hierher umlegen — siehe DEPLOY.md.
server {
    server_name lernassi.hydrocode.cloud;

    location / {
        # Aufschrieb-Fotos kommen als Upload herein.
        client_max_body_size 25M;

        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/lernassi.hydrocode.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lernassi.hydrocode.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name lernassi.hydrocode.cloud;
    listen 80;

    # Verlängerung per webroot, ohne Umleitung.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
