<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="lernassi staging">
	<title>lernassi staging</title>
	<defs>
		<clipPath id="ecke">
			<rect width="512" height="512" rx="112"/>
		</clipPath>
	</defs>
	<rect width="512" height="512" rx="112" fill="#ccccf8"/>
	<rect x="146" y="116" width="220" height="280" rx="34" fill="#ffffff"/>
	<path d="M194 258 L238 306 L322 204" fill="none" stroke="#0e6549" stroke-width="40"
		stroke-linecap="round" stroke-linejoin="round"/>
	<!-- Im Tab bleibt bei 16 px nur ein dunkler Streifen übrig — genau der ist gemeint.
	     Der Schriftzug ist für die Lesezeichenliste und die Offline-Seite da. -->
	<g id="binde" clip-path="url(#ecke)">
		<rect x="0" y="360" width="512" height="152" fill="#362c24"/>
		<text x="256" y="443" textLength="392" lengthAdjust="spacingAndGlyphs"
			font-family="Quicksand, ui-rounded, system-ui, sans-serif" font-size="80" font-weight="700"
			fill="#ffffff" text-anchor="middle">staging</text>
	</g>
</svg>
